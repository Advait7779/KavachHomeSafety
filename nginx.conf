map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Coolify supplies the client chain. Do not append its proxy address again:
# Express trusts this Nginx hop when applying per-client rate limits.
map $http_x_forwarded_for $client_forwarded_for {
    default $http_x_forwarded_for;
    '' $remote_addr;
}

server {
    listen 4004;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://api:4005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:4005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Vite fingerprints assets; these can be cached indefinitely.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Branding and default images keep stable filenames across releases.
    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|svg|woff2?)$ {
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /index.html {
        return 301 /;
    }

    location = / {
        proxy_pass http://api:4005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
    }

    # HTML responses come from Express; static assets remain on Nginx.
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://api:4005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
